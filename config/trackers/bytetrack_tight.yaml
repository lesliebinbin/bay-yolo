# "Tight" ByteTrack profile for bay-yolo person extraction:
# fewer ID switches / duplicate tracks between close workers, at the cost of
# slightly more track fragmentation (short fragments are culled by --min-frames).
#
# vs the stock defaults:
#   track_high_thresh 0.25 -> 0.5   only confident boxes enter first-stage matching
#   new_track_thresh  0.25 -> 0.35  fewer spurious new tracks from ghost detections
#   track_buffer      30   -> 15   lost IDs die faster -> fewer stale-ID re-associations
#   match_thresh      0.8  -> 0.9  stricter IoU association -> less A/B confusion on overlap

tracker_type: bytetrack # (str) Tracker backend: bytetrack
track_high_thresh: 0.5 # (float) First-stage match threshold; raise for cleaner tracks, lower to keep more
track_low_thresh: 0.1 # (float) Second-stage threshold for low-score matches; balances recovery vs drift
new_track_thresh: 0.35 # (float) Start a new track if no match >= this; higher reduces false tracks
track_buffer: 15 # (int) Frames to keep lost tracks alive; higher handles occlusion, increases ID switch risk
match_thresh: 0.9 # (float) Association similarity threshold (IoU/cost); tune with detector quality
fuse_score: True # (bool) Fuse detection score with motion/IoU for matching; stabilizes weak detections
