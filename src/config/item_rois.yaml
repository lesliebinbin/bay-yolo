# Item ROI Configurations
# Coordinates are normalized YOLO format: [x_center, y_center, width, height]
# angle_type: A = Video 01 (Overhead), B = Video 02 (Side)

personnel_id:
  - angle_type: A
    roi: [0.5, 0.5, 0.8, 0.8]
    is_temporal: false
  - angle_type: B
    roi: [0.5, 0.5, 0.8, 0.8]
    is_temporal: false

ppe_helmet:
  - angle_type: A
    roi: [0.5, 0.5, 0.8, 0.8]
    is_temporal: false
  - angle_type: B
    roi: [0.5, 0.5, 0.8, 0.8]
    is_temporal: false

