[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_python_project", "src/cli", "src/models", "src/preprocessing", "src/utils"]

[project]
name = "my-python-project"
version = "0.1.0"
description = "A mise and uv managed Python project"
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.12"
authors = [{ name = "Your Name" }]
dependencies = [
    "clip",
    "einops>=0.8.2",
    "gradio>=6.31.0",
    "lap>=0.5.12",
    "lightning>=2.6.6",
    "peft>=0.21.2",
    "transformers>=4.53",
    "ultralytics>=8.4.210",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.scripts]
c_yoloe = "cli.yoloe:main"
c_yolo_pose = "cli.yolo_pose:main"
c_yolo_keypoints_extract = "cli.yolo_keypoints_extract:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipython>=9.18.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }
